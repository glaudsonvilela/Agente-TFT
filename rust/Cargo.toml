[workspace]
members = ["crates/contracts", "crates/capture-core", "crates/capture-replay", "crates/state-engine", "crates/perception-core", "crates/state-fusion", "crates/perception-hud", "crates/image-preprocess", "crates/ocr-tesseract", "crates/riot-api", "crates/tft-math", "crates/tft-rules", "crates/telemetry-core", "apps/replay-inspect", "apps/roi-replay-inspect", "apps/riot-api-inspect"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
