[workspace]

[package]
name = "agente-tft-unit-features-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
default-run = "agente-tft-unit-features-lab"

[dependencies]
agente-tft-image-preprocess = { path = "../../rust/crates/image-preprocess" }
agente-tft-capture-core = { path = "../../rust/crates/capture-core" }
agente-tft-contracts = { path = "../../rust/crates/contracts" }
agente-tft-perception-board = { path = "../../rust/crates/perception-board" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "=0.25.10", default-features = false, features = ["png", "webp"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
