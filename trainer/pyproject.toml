[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-tft-remote-trainer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
pythonpath = [".", "../apps/hud_mapper"]
testpaths = ["tests"]

[tool.setuptools]
packages = ["remote_trainer"]

[tool.setuptools.package-data]
remote_trainer = ["dashboard.html"]
