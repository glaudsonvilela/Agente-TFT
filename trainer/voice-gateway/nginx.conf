worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 4k;
    client_body_buffer_size 4k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 15s;
    send_timeout 10s;
    # This listener is reachable only on the host; cloudflared supplies this header.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    limit_req_zone $binary_remote_addr zone=tft_requests:1m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=tft_neural:1m rate=10r/s;
    limit_req_status 429;
    server {
        listen 127.0.0.1:8803 default_server;
        server_name tft.bigbanana.io;
        if ($host != tft.bigbanana.io) { return 404; }
        if ($http_x_forwarded_proto = http) { return 301 https://tft.bigbanana.io$request_uri; }
        limit_req zone=tft_requests burst=12 nodelay;
        add_header X-Content-Type-Options nosniff always;
        location = / {
            default_type application/json;
            return 200 '{"service":"Agente TFT","status":"online"}';
        }
        location = /health {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8802;
        }
        location ~ ^/v1/(session|voice|player-summary)$ {
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8802;
        }
        location = /v1/neural/client-session {
            client_max_body_size 16k;
            limit_req zone=tft_requests burst=12 nodelay;
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8801;
        }
        location = /v1/neural/sessions {
            client_max_body_size 64k;
            limit_req zone=tft_requests burst=12 nodelay;
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8801;
        }
        location ~ ^/v1/neural/sessions/[0-9a-f-]+$ {
            client_max_body_size 16k;
            limit_req zone=tft_requests burst=12 nodelay;
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8801;
        }
        location ~ ^/v1/neural/sessions/[0-9a-f-]+/frames$ {
            client_max_body_size 8m;
            client_body_buffer_size 256k;
            limit_req zone=tft_neural burst=30 nodelay;
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8801;
            proxy_read_timeout 20s;
            proxy_send_timeout 20s;
        }
        location ~ ^/v1/neural/sessions/[0-9a-f-]+/seal$ {
            client_max_body_size 64k;
            limit_req zone=tft_requests burst=12 nodelay;
            limit_except POST { deny all; }
            proxy_pass http://127.0.0.1:8801;
        }
        location ~ ^/v1/neural/sessions/[0-9a-f-]+/learning$ {
            client_max_body_size 16k;
            limit_req zone=tft_requests burst=12 nodelay;
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8801;
        }
        location = /v1/neural/champion {
            client_max_body_size 16k;
            limit_req zone=tft_requests burst=12 nodelay;
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8801;
        }
        location ~ ^/v1/neural/champion/package/(stable|shadow)/[0-9]+$ {
            client_max_body_size 16k;
            limit_req zone=tft_requests burst=12 nodelay;
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8801;
            proxy_read_timeout 120s;
            proxy_send_timeout 20s;
        }
        location / { return 404; }
        proxy_http_version 1.1;
        proxy_set_header Host tft.bigbanana.io;
        proxy_set_header Connection "";
        # Replace incoming forwarding chains; never pass client-supplied XFF through.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 6s;
        proxy_send_timeout 6s;
        proxy_buffering off;
    }
}
