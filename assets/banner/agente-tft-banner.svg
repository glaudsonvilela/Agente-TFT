    <polygon points="150,130 225,85 300,130 300,215 225,260 150,215"/>
    <polygon points="300,130 375,85 450,130 450,215 375,260 300,215"/>
    <polygon points="75,260 150,215 225,260 225,345 150,390 75,345"/>
    <polygon points="225,260 300,215 375,260 375,345 300,390 225,345"/>
  </g>
