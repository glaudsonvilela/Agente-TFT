    <text x="55" y="140" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#bfefff">Player 2 está contestando X.</text>
    <text x="55" y="190" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#bfefff">Busque X 2★ e pare.</text>
    <text x="55" y="255" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#f4d06f">Confiança 84%</text>
