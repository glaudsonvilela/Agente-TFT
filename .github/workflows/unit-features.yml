name: Native unit features
on:
  pull_request:
    paths:
      - 'rust/crates/capture-core/**'
      - 'rust/crates/image-preprocess/**'
      - 'tools/unit-features-lab/**'
      - 'trainer/tests/test_autonomous_corpus.py'
      - 'trainer/scripts/ingest_autonomous_corpus.py'
      - 'scripts/run_post_session_shadow_learning.py'
      - 'scripts/train_weighted_autonomous_challenger.py'
      - '.github/workflows/unit-features.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native crop and vector contracts
        run: cargo test --locked --release --manifest-path tools/unit-features-lab/Cargo.toml -p agente-tft-image-preprocess
      - name: Gallery and dataset contracts
        run: cargo test --locked --release --manifest-path tools/unit-features-lab/Cargo.toml
