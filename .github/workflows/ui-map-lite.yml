name: UI-Map Lite
on:
  pull_request:
    paths: ['training/ui_map_lite/**', 'training/tests/test_ui_map_lite*', 'configs/vision/uimap-lite*', 'scripts/*ui_map_lite.sh', 'training/requirements-ui-map-runtime.txt', '.github/workflows/ui-map-lite.yml']
  push:
    branches: [main]
    paths: ['training/ui_map_lite/**', 'training/tests/test_ui_map_lite*', 'configs/vision/uimap-lite*', 'scripts/*ui_map_lite.sh', 'training/requirements-ui-map-runtime.txt', '.github/workflows/ui-map-lite.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train-export-infer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU training and small inference dependencies
        run: |
          python -m pip install 'torch==2.12.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r training/requirements-ui-map-runtime.txt
      - name: Contracts and mandatory real optimization/ONNX integration
        env:
          TFT_REQUIRE_UIMAP_NATIVE: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: |
          python -m unittest training.tests.test_ui_map_lite training.tests.test_ui_map_lite_sources training.tests.test_ui_map_lite_native -v
          bash -n scripts/train_match001_ui_map_lite.sh
      - name: Whole-tree structural review
        run: python -m training.code_health_audit --root . --output /tmp/uimap-code-review.json
