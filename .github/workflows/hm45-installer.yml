name: HM4.5 guided installer contracts

on:
  push:
    branches:
      - work/hm45-interactive-installer
    paths:
      - 'apps/hud_mapper/AgenteTFT_HUD_HM4.py'
      - 'apps/hud_mapper/hm45_setup*.py'
      - 'apps/hud_mapper/tests/test_hm45_setup.py'
      - 'scripts/hm45_installer/**'
      - 'scripts/build_hm45_installer_windows.py'
      - 'scripts/build_hm45_online_installer_windows.py'
      - 'scripts/build_hud_mapper_hm4_windows.py'
      - 'trainer/scripts/**'
      - 'trainer/remote_trainer/**'
      - 'apps/hud_mapper/tests/test_post_session_learning.py'
      - 'apps/hud_mapper/tests/test_unit_head_parity.py'
      - 'apps/hud_mapper/tests/test_neural_service.py'
      - 'apps/hud_mapper/hm/vm_bridge.py'
      - 'apps/hud_mapper/hm/unit_head.py'
      - 'apps/hud_mapper/hm/post_session_learning.py'
      - 'apps/hud_mapper/hm/neural_service.py'
      - 'apps/hud_mapper/hm/model_update.py'
      - '.github/workflows/hm45-installer.yml'
      - 'apps/hud_mapper/hm/**'
      - 'ui/tauri-design/**'
      - 'apps/hud_mapper/tests/test_studio_bridge.py'
      - 'trainer/**'
  pull_request:
    paths:
      - 'apps/hud_mapper/AgenteTFT_HUD_HM4.py'
      - 'apps/hud_mapper/hm45_setup*.py'
      - 'apps/hud_mapper/tests/test_hm45_setup.py'
      - 'scripts/hm45_installer/**'
      - 'scripts/build_hm45_installer_windows.py'
      - 'scripts/build_hm45_online_installer_windows.py'
      - 'scripts/build_hud_mapper_hm4_windows.py'
      - '.github/workflows/hm45-installer.yml'
      - 'apps/hud_mapper/hm/**'
      - 'ui/tauri-design/**'
      - 'apps/hud_mapper/tests/test_studio_bridge.py'
      - 'apps/hud_mapper/tests/test_post_session_learning.py'
      - 'trainer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HM4 runtime contract dependencies
        run: |
          python -m pip install pytest Pillow numpy onnxruntime
          if ($LASTEXITCODE -ne 0) { throw 'HM4 contract dependencies failed' }
      - name: Test resumable setup and package gates
        run: |
          python -m unittest discover -s apps/hud_mapper/tests -p 'test_hm45_setup.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Setup contracts failed' }
          python -m unittest discover -s apps/hud_mapper/tests -p 'test_hm45_setup_ui.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Setup UI smoke failed' }
          python -m py_compile apps/hud_mapper/hm45_setup.py apps/hud_mapper/hm45_setup_core.py scripts/build_hm45_installer_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Setup compilation failed' }
          $env:PYTHONPATH = "apps/hud_mapper;apps/e1_replay"
          python -m pytest -q apps/hud_mapper/tests/test_post_session_learning.py apps/hud_mapper/tests/test_neural_service.py apps/hud_mapper/tests/test_unit_head_parity.py
          if ($LASTEXITCODE -ne 0) { throw 'Zero-click neural/runtime parity contracts failed' }
          python -m py_compile apps/hud_mapper/hm/model_update.py apps/hud_mapper/hm/neural_service.py apps/hud_mapper/hm/post_session_learning.py apps/hud_mapper/hm/unit_head.py apps/hud_mapper/hm/vm_bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'HM4 neural client compilation failed' }
          python -m unittest discover -s apps/hud_mapper/tests -p 'test_studio_bridge.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Studio bridge contract failed' }
          python -m py_compile apps/hud_mapper/hm/studio_bridge.py scripts/build_hud_mapper_hm4_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Studio packaging compilation failed' }
          node --check ui/tauri-design/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Studio design JS failed' }
          node --check ui/tauri-design/connected.js
          if ($LASTEXITCODE -ne 0) { throw 'Studio integration JS failed' }
      - name: Check Inno Setup wizard syntax with nonrelease fixtures
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          New-Item -ItemType Directory -Force -Path dist/AgenteTFT-HUD-HM4-Auto, build/hm45-core | Out-Null
          Copy-Item C:/Windows/System32/notepad.exe dist/AgenteTFT-HUD-HM4-Auto/AgenteTFT-HUD-HM4-Auto.exe
          Set-Content -Path build/hm45-core/core-package.json -Value '{}' -Encoding utf8
          Set-Content -Path build/hm45-core/fixture.txt -Value 'syntax fixture' -Encoding utf8
          tar -cf build/hm45-core/AgenteTFT-Core-v2.tar -C build/hm45-core fixture.txt
          Copy-Item scripts/hm45_installer/AgenteTFT_HM45.iss build/HM45.iss
          Copy-Item ui/tauri-design/icons/icon.ico build/hm45-design-icon.ico
          $iscc = @('C:/Program Files (x86)/Inno Setup 6/ISCC.exe', 'C:/Program Files/Inno Setup 6/ISCC.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe missing' }
          & $iscc build/HM45.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno wizard compilation failed' }
          python scripts/build_hm45_online_installer_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Online bootstrap compilation failed' }
          Remove-Item dist/AgenteTFT-HM45-Setup.exe
          Remove-Item dist/AgenteTFT-HM45-Online-Setup.exe
