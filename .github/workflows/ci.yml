name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    runs-on: ubuntu-latest
    env:
      HUD_REQUIRE_MEDIA_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install media tools for real smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg tesseract-ocr tesseract-ocr-eng
          ffmpeg -version
          ffprobe -version
          tesseract --list-langs
      - name: Test Rust workspace
        run: cargo test --manifest-path rust/Cargo.toml

  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install agent and test dependencies
        run: python -m pip install -e "./agent[dev]"
      - name: Test Python agent/contracts
        working-directory: agent
        run: python -m pytest -q
      - name: Test ingestion pipeline
        run: python -m unittest discover -s ingestion/tests -v
      - name: Test training utilities
        run: python -m unittest discover -s training/tests -v
      - name: Install remote trainer
        run: python -m pip install -e "./trainer[dev]"
      - name: Test remote trainer
        working-directory: trainer
        run: python -m pytest -q
