name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Report optional media tools
        run: |
          command -v ffmpeg >/dev/null && ffmpeg -version | head -n 1 || echo "ffmpeg: unavailable (smoke test will skip)"
          command -v ffprobe >/dev/null && ffprobe -version | head -n 1 || echo "ffprobe: unavailable (smoke test will skip)"
          command -v tesseract >/dev/null && tesseract --version | head -n 1 || echo "tesseract: unavailable (unit tests do not require binary)"
      - name: Test Rust workspace
        run: cargo test --manifest-path rust/Cargo.toml

  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install agent and test dependencies
        run: |
          python -m pip install -e "./agent[dev]"
          python -m pip install -r training/requirements-board-hub.txt
      - name: Test Python agent/contracts
        working-directory: agent
        run: python -m pytest -q
      - name: Test ingestion pipeline
        run: python -m unittest discover -s ingestion/tests -v
      - name: Install CPU backend for training tests only
        run: python -m pip install 'torch==2.12.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Test training utilities
        run: python -m unittest discover -s training/tests -v
      - name: Whole-tree structural code review
        run: python -m training.code_health_audit --root . --output /tmp/tft-code-review.json
      - name: Install remote trainer
        run: python -m pip install -e "./trainer[dev]"
      - name: Test remote trainer
        working-directory: trainer
        run: python -m pytest -q
      - name: Compile central neural worker scripts
        run: |
          python -m py_compile             trainer/neural_worker.py             trainer/scripts/process_neural_job.py             trainer/scripts/ingest_autonomous_corpus.py             trainer/scripts/build_champion_bundle.py             trainer/scripts/seed_initial_champion.py             trainer/scripts/calibrate_unit_head_runtime_gates.py             trainer/scripts/evaluate_shadow_candidate_gold.py             trainer/scripts/manage_shadow_promotion.py             trainer/scripts/prune_neural_storage.py             scripts/prepare_bigbanana_neural_bundle.py
          bash -n trainer/scripts/deploy_bigbanana_neural.sh
