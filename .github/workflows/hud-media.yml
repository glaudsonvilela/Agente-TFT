name: HUD media
on:
  pull_request:
    paths:
      - 'rust/**'
      - 'configs/hud/**'
      - 'configs/player-list/**'
      - 'configs/ui/**'
      - 'configs/topology/**'
      - 'configs/contexts/**'
      - 'ingestion/knowledge_release.py'
      - 'training/shop_replay_observe.py'
      - 'training/shop_recovery_compare.py'
      - 'training/shop_controls_evidence.py'
      - 'training/shop_controls_profile.py'
      - 'training/shop_controls_patch_run.py'
      - 'training/shop_numbers*.py'
      - 'training/tests/test_shop_numbers*.py'
      - 'training/tests/test_shop_controls*.py'
      - 'training/tests/test_shop_recovery.py'
      - 'training/tests/test_shop_replay*.py'
      - 'scripts/probe_match001_shop.sh'
      - 'scripts/probe_match001_shop_v2.sh'
      - 'scripts/probe_match001_shop_controls.sh'
      - 'scripts/probe_match001_shop_controls_v2.sh'
      - 'scripts/probe_match001_shop_numbers.sh'
      - 'training/player_hp_dense.py'
      - 'training/tests/test_player_hp_dense.py'
      - 'scripts/probe_match001_player_hp_dense.sh'
      - 'training/player_hp_text_fit.py'
      - 'training/tests/test_player_hp_text_fit.py'
      - 'scripts/probe_match001_player_hp_fit.sh'
      - 'training/player_hp_disjoint_shadow.py'
      - 'training/tests/test_player_hp_disjoint_shadow.py'
      - 'scripts/probe_match001_player_hp_disjoint.sh'
      - 'training/perception_work*.py'
      - 'training/run_perception_worker.py'
      - 'training/tests/test_perception_worker*.py'
      - 'scripts/work_match001_perception.sh'
      - '.github/workflows/hud-media.yml'
concurrency:
  group: hud-media-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install real media backends
        timeout-minutes: 4
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y ffmpeg tesseract-ocr tesseract-ocr-eng
          tesseract --list-langs
      - name: Native preparation, OCR process and sparse seek tests
        env:
          TFT_REQUIRE_OCR_SMOKE: '1'
        run: cargo test --manifest-path rust/Cargo.toml -p agente-tft-perception-hud -p agente-tft-ocr-tesseract -p agente-tft-hud-replay-probe -- --nocapture
      - name: Dense source timestamps and native HP probe integration
        env:
          TFT_HP2_REQUIRE_MEDIA: '1'
          TFT_HP2_PROBE_BIN: ${{ github.workspace }}/rust/target/debug/agente-tft-player-hp-probe
        run: |
          cargo build --manifest-path rust/Cargo.toml -p agente-tft-player-hp-probe
          python3 -m unittest training.tests.test_player_hp_dense -v
      - name: Paired text fitting with native HP1 and candidate
        env:
          TFT_REQUIRE_HP3_NATIVE: '1'
          TFT_HP3_PROBE: ${{ github.workspace }}/rust/target/debug/agente-tft-player-hp-fit-probe
          OMP_THREAD_LIMIT: '1'
        run: |
          cargo test --manifest-path rust/Cargo.toml -p agente-tft-player-hp-fit-probe -- --nocapture
          cargo build --manifest-path rust/Cargo.toml -p agente-tft-player-hp-fit-probe
          python3 -m unittest training.tests.test_player_hp_text_fit -v
      - name: Disjoint frozen-reader evaluation with inherited quarantine
        env:
          TFT_REQUIRE_HP5_NATIVE: '1'
          TFT_HP5_PROBE: ${{ github.workspace }}/rust/target/debug/agente-tft-player-hp-fit-probe
          OMP_THREAD_LIMIT: '1'
        run: python3 -m unittest training.tests.test_player_hp_disjoint_shadow -v
      - name: A16 reserved worker lifecycle with real native reader
        env:
          TFT_REQUIRE_A16_NATIVE: '1'
          TFT_A16_PROBE: ${{ github.workspace }}/rust/target/debug/agente-tft-player-hp-fit-probe
          OMP_THREAD_LIMIT: '1'
        run: python3 -m unittest training.tests.test_perception_worker training.tests.test_perception_worker_process training.tests.test_perception_worker_native -v
      - name: Shop atlas and empty versus unknown with native OCR
        env:
          TFT_REQUIRE_SHOP1_NATIVE: '1'
          TFT_SHOP1_PROBE: ${{ github.workspace }}/rust/target/debug/agente-tft-shop-replay-probe
          OMP_THREAD_LIMIT: '1'
        run: |
          cargo test --manifest-path rust/Cargo.toml -p agente-tft-shop-replay-probe -- --nocapture
          cargo build --manifest-path rust/Cargo.toml -p agente-tft-shop-replay-probe
          python3 -m unittest training.tests.test_shop_replay_native training.tests.test_shop_recovery -v
      - name: Shop control appearances and unchanged card observations
        env:
          TFT_REQUIRE_SHOP3_NATIVE: '1'
          TFT_SHOP3_PROBE: ${{ github.workspace }}/rust/target/debug/agente-tft-shop-replay-probe
          OMP_THREAD_LIMIT: '1'
        run: python3 -m unittest training.tests.test_shop_controls training.tests.test_shop_controls_native -v
      - name: Shop UI data patches with frozen native reader
        env:
          TFT_REQUIRE_SHOP4_NATIVE: '1'
          TFT_SHOP4_PROBE: ${{ github.workspace }}/rust/target/debug/agente-tft-shop-replay-probe
          OMP_THREAD_LIMIT: '1'
        run: python3 -m unittest training.tests.test_shop_controls_profile training.tests.test_shop_controls_patch_native -v
      - name: Isolated numbers and appearance-selected UI geometry
        env:
          TFT_REQUIRE_SHOP5_NATIVE: '1'
          TFT_SHOP5_PROBE: ${{ github.workspace }}/rust/target/debug/agente-tft-shop-replay-probe
          OMP_THREAD_LIMIT: '1'
        run: python3 -m unittest training.tests.test_shop_numbers training.tests.test_shop_numbers_native -v
