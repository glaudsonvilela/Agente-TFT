name: HUD Mapper HM1
on:
  pull_request:
    paths:
      - 'apps/hud_mapper/**'
      - 'tools/hm-hp-native/**'
      - 'scripts/build_hud_mapper_windows.py'
      - '.github/workflows/hud-mapper.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: apps/hud_mapper:apps/e1_replay:experiments/ui-map-lite-l2/training
      OMP_THREAD_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr xvfb python3-tk
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r apps/hud_mapper/requirements.txt
      - run: cargo test --manifest-path tools/hm-hp-native/Cargo.toml && cargo build --release --manifest-path tools/hm-hp-native/Cargo.toml
      - run: cargo test --manifest-path tools/e1-native/Cargo.toml && cargo build --release --manifest-path tools/e1-native/Cargo.toml
      - run: python -m unittest discover -s apps/hud_mapper/tests -v
      - run: python -m unittest discover -s apps/e1_replay/tests -v
      - run: python apps/hud_mapper/tests/integration.py --output hm-check
      - run: xvfb-run -a python apps/hud_mapper/AgenteTFT_HUD.py --ui-smoke --video hm-check/input.mkv --model hm-check/model/deployment-candidate.json --output hm-ui-check
      - uses: actions/upload-artifact@v4
        with:
          name: HUD-Mapper-Linux-Evidence
          path: |
            hm-check/**/*.json
            hm-ui-check/*.json
  windows-portable:
    needs: linux-contracts
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: apps/hud_mapper;apps/e1_replay;experiments/ui-map-lite-l2/training
      OMP_THREAD_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build-host media dependencies
        shell: pwsh
        run: |
          choco install ffmpeg tesseract -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Media install failed' }
          $ff = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ff.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\Program Files\Tesseract-OCR' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r apps/hud_mapper/requirements.txt pyinstaller==6.13.0
      - run: cargo test --manifest-path tools/hm-hp-native/Cargo.toml
      - run: cargo build --release --manifest-path tools/hm-hp-native/Cargo.toml
      - run: cargo test --manifest-path tools/e1-native/Cargo.toml
      - run: cargo build --release --manifest-path tools/e1-native/Cargo.toml
      - run: python -m unittest discover -s apps/hud_mapper/tests -v
      - run: python -m unittest discover -s apps/e1_replay/tests -v
      - run: python apps/hud_mapper/tests/integration.py --output hm-check
      - run: python scripts/build_hud_mapper_windows.py
      - name: Executable mapping and UI with real ONNX + OCR + PNG collection
        shell: pwsh
        run: |
          & .\dist\AgenteTFT-HUD\AgenteTFT-HUD.exe --headless --video hm-check/input.mkv --model hm-check/model/deployment-candidate.json --output packaged-hud --seconds 2
          if ($LASTEXITCODE -ne 0) { throw 'Packaged mapping failed' }
          & .\dist\AgenteTFT-HUD\AgenteTFT-HUD.exe --ui-smoke --video hm-check/input.mkv --model hm-check/model/deployment-candidate.json --output packaged-ui
          if ($LASTEXITCODE -ne 0) { throw 'Packaged HUD UI failed' }
          & .\dist\AgenteTFT-HUD\AgenteTFT-HUD.exe --train --dataset hm-check/training-session --model hm-check/model/deployment-candidate.json --output packaged-train --steps 4 --allow-weak
          if ($LASTEXITCODE -ne 0) { throw 'Packaged training failed' }
          python apps/hud_mapper/tests/check_package.py packaged-hud packaged-ui packaged-train
          if ($LASTEXITCODE -ne 0) { throw 'Evidence checks failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: AgenteTFT-HUD-Mapper-Windows-x64
          path: dist/AgenteTFT-HUD-Mapper-Windows-x64.zip
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HUD-Mapper-Windows-Evidence
          path: |
            hm-check/**/*.json
            packaged-hud/*.json
            packaged-ui/*.json
            packaged-train/*.json
