name: HUD Mapper HM4 Auto

# [full] on a push enables packaging + packaged WGC smoke; normal pushes use the fast validation path.

on:
  push:
    branches:
      - work/hud-mapper-hm4-auto
      - work/hud-mapper-hm43-async-hp-graceful-stop
      - work/hud-mapper-hm44-ocr-hub
    paths:
      - 'apps/hud_mapper/**'
      - 'scripts/build_hud_mapper_hm4_windows.py'
      - 'scripts/audit_hm4_session.py'
      - 'scripts/compare_hm4_audits.py'
      - 'scripts/compact_hm3_payload.py'
      - 'tools/hm-capture-native/**'
      - 'tools/hm-hp-native/**'
      - 'tools/e1-native/**'
      - 'tools/hm-ocr-cost/**'
      - 'tools/hm-ocr-hub-probe/**'
      - 'rust/crates/ocr-tesseract/**'
      - 'rust/crates/perception-hud/**'
      - 'docs/HUD_MAPPER_HM4_AUTO.md'
      - '.github/workflows/hud-mapper-hm4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hm4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: apps/hud_mapper;apps/e1_replay;experiments/ui-map-lite-l2/training
      OMP_THREAD_LIMIT: '1'
      FULL_PACKAGE: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install test dependency
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency install failed' }
          'C:\Program Files\Tesseract-OCR' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python runtime packages
        shell: pwsh
        run: |
          python -m pip install -r apps/hud_mapper/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python runtime dependencies failed' }

      - name: Install packaging dependencies
        if: env.FULL_PACKAGE == 'true'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          python -m pip install pyinstaller==6.13.0 jaraco.text==4.0.0 jaraco.context==6.0.0 jaraco.functools==4.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Packaging Python dependencies failed' }

      - name: HM4 contracts
        run: python -m unittest discover -s apps/hud_mapper/tests -p 'test_hm4_runtime.py' -v

      - name: HM4.4 OCR cost probe
        shell: pwsh
        run: |
          cargo run --release --manifest-path tools/hm-ocr-cost/Cargo.toml -- tesseract --iterations 8 --output hm4-ocr-cost.json
          if ($LASTEXITCODE -ne 0) { throw 'HM4.4 OCR cost probe failed' }

      - name: HM4.4 resident OCR hub parity
        shell: pwsh
        run: |
          python apps/hud_mapper/tests/make_hm44_ocr_parity_fixtures.py
          if ($LASTEXITCODE -ne 0) { throw 'HM4.4 parity fixture generation failed' }
          cargo run --release --manifest-path tools/hm-ocr-hub-probe/Cargo.toml -- "C:\Program Files\Tesseract-OCR\tesseract.exe" hm44-parity-fixtures --repeats 3 --output hm44-ocr-hub-parity.json
          if ($LASTEXITCODE -ne 0) { throw 'HM4.4 resident OCR parity failed' }

      - name: Audit utility contracts
        shell: pwsh
        run: |
          python -m py_compile scripts/audit_hm4_session.py
          python scripts/audit_hm4_session.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'HM4 audit contracts failed' }

      - name: Comparison utility contracts
        shell: pwsh
        run: |
          python -m py_compile scripts/compare_hm4_audits.py
          python scripts/compare_hm4_audits.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'HM4 comparison contracts failed' }

      - name: Build native capture/readers
        shell: pwsh
        run: |
          cargo build --release --manifest-path tools/hm-capture-native/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'hm-capture-native build failed' }
          cargo build --release --manifest-path tools/hm-hp-native/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'hm-hp-native build failed' }
          cargo test --manifest-path rust/Cargo.toml -p agente-tft-ocr-tesseract -p agente-tft-perception-hud
          if ($LASTEXITCODE -ne 0) { throw 'OCR/perception tests failed' }
          cargo test --manifest-path tools/e1-native/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'e1-native tests failed' }
          cargo build --release --manifest-path tools/e1-native/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'e1-native build failed' }

      - name: HM4 exact-cache benchmark
        shell: pwsh
        run: |
          python apps/hud_mapper/tests/hm4_cache_benchmark.py --worker tools/e1-native/target/release/agente-tft-e1-worker.exe --hp-worker tools/hm-hp-native/target/release/agente-tft-hm-hp.exe --configs configs --output hm4-cache-benchmark.json --worker-log hm4-cli-worker-stderr.log --hp-log hm4-cli-hp-stderr.log
          if ($LASTEXITCODE -ne 0) { throw 'HM4 cache benchmark failed' }

      - name: HM4.4 resident HUD A/B benchmark
        shell: pwsh
        run: |
          $env:AGENTE_TFT_RESIDENT_OCR='1'
          python apps/hud_mapper/tests/hm4_cache_benchmark.py --worker tools/e1-native/target/release/agente-tft-e1-worker.exe --hp-worker tools/hm-hp-native/target/release/agente-tft-hm-hp.exe --configs configs --output hm44-resident-cache-benchmark.json --worker-log hm44-resident-worker-stderr.log --hp-log hm44-resident-hp-stderr.log
          $code=$LASTEXITCODE
          Remove-Item Env:AGENTE_TFT_RESIDENT_OCR -ErrorAction SilentlyContinue
          if (Test-Path hm44-resident-worker-stderr.log) { Write-Host 'HM44_RESIDENT_WORKER_STDERR_BEGIN'; Get-Content hm44-resident-worker-stderr.log; Write-Host 'HM44_RESIDENT_WORKER_STDERR_END' }
          if ($code -ne 0) { throw 'HM4.4 resident benchmark failed' }
          python -c "import json; a=json.load(open('hm4-cache-benchmark.json')); b=json.load(open('hm44-resident-cache-benchmark.json')); old=a['third_changed_hud_only']['wall_ms']; new=b['third_changed_hud_only']['wall_ms']; assert b['third_numeric_hud_ocr_backend']=='resident_tesseract_c_api_v1', b; assert a['third_numeric_hud_ocr_backend']=='cli_process_v1', a; assert new < old*0.50, (old,new); print('HM44_RESIDENT_AB='+json.dumps({'cli_hud_only_wall_ms':old,'resident_hud_only_wall_ms':new,'ratio':new/old,'speedup':old/new}))"
          if ($LASTEXITCODE -ne 0) { throw 'HM4.4 resident A/B gate failed' }

      - name: Package HM4 Auto
        if: env.FULL_PACKAGE == 'true'
        run: python scripts/build_hud_mapper_hm4_windows.py

      - name: One packaged capture/UI verification
        if: env.FULL_PACKAGE == 'true'
        shell: pwsh
        run: |
          python apps/hud_mapper/tests/hm4_capture_smoke.py --app dist/AgenteTFT-HUD-HM4-Auto/AgenteTFT-HUD-HM4-Auto.exe --output hm4-portable --ui
          if ($LASTEXITCODE -ne 0) { throw 'HM4 packaged smoke failed' }

      - uses: actions/upload-artifact@v4
        if: env.FULL_PACKAGE == 'true'
        with:
          name: AgenteTFT-HUD-HM4-Auto-Windows-x64
          path: |
            dist/AgenteTFT-HUD-HM4-Auto-Windows-x64.zip
            dist/AgenteTFT-HUD-HM4-Auto-Setup.exe
            dist/HM4_PACKAGE_REPORT.json
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HUD-HM4-Evidence
          path: |
            hm4-cache-benchmark.json
            hm44-resident-cache-benchmark.json
            hm4-cli-worker-stderr.log
            hm4-cli-hp-stderr.log
            hm44-resident-worker-stderr.log
            hm44-resident-hp-stderr.log
            hm4-ocr-cost.json
            hm44-ocr-hub-parity.json
            hm4-portable/*.json
            hm4-portable-launcher.log
            dist/HM4_COMPACTION_REPORT.json
            dist/HM4_PACKAGE_REPORT.json
            dist/AgenteTFT-HUD-HM4-Auto/BUILD_MANIFEST.json
          retention-days: 30
